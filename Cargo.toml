[package]
name = "rust-mcp-filesystem"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A root-confined filesystem MCP server written in Rust"

[dependencies]
anyhow = "1"
cap-std = "4"
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.4", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
