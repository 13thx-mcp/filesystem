name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Resolve and validate version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "invalid release tag: $tag" >&2; exit 1;; esac
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')"
          version="${tag#v}"
          test "$version" = "$package_version" || { echo "tag $tag != Cargo.toml $package_version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets --all-features

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-amd64
            machine: x86_64
          - runner: macos-15
            platform: darwin-arm64
            machine: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          test "$actual" = "${{ matrix.machine }}" || { echo "expected ${{ matrix.machine }}, got $actual" >&2; exit 1; }
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package release artifact
        shell: bash
        run: |
          set -euo pipefail
          name="rust-mcp-filesystem-v${{ needs.verify.outputs.version }}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          install -m 0755 "target/release/rust-mcp-filesystem" "dist/$name/rust-mcp-filesystem"
          test -f README.md && cp README.md "dist/$name/" || true
          test -f LICENSE && cp LICENSE "dist/$name/" || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" | sed 's#  dist/#  #' > "dist/$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Build checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cat dist/*.sha256 | sort -k2 > dist/SHA256SUMS.txt
          rm dist/*.sha256
          cat dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.verify.outputs.tag }}"
          repo="${{ github.repository }}"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$repo" --clobber
          else
            gh release create "$tag" dist/* --repo "$repo" --title "$tag" --generate-notes --verify-tag
          fi
